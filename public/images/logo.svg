<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the circular design -->
    <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8FBC8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>
    
    <!-- Brown color for swirl accents -->
    <linearGradient id="brownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="40" cy="40" r="35" fill="url(#circleGradient)" stroke="#228B22" stroke-width="2"/>
  
  <!-- Swirl design elements -->
  <path d="M 25 25 Q 40 15 55 25 Q 50 40 35 45 Q 25 35 25 25" 
        fill="url(#brownGradient)" opacity="0.8"/>
  <path d="M 35 30 Q 45 25 50 35 Q 45 45 35 40 Q 30 35 35 30" 
        fill="#228B22" opacity="0.7"/>
  <path d="M 30 50 Q 45 55 55 45 Q 50 35 40 40 Q 30 45 30 50" 
        fill="url(#brownGradient)" opacity="0.6"/>
  
  <!-- Decorative dots -->
  <circle cx="45" cy="20" r="2" fill="#8B4513"/>
  <circle cx="60" cy="35" r="1.5" fill="#228B22"/>
  <circle cx="25" cy="55" r="1.5" fill="#8B4513"/>
  
  <!-- Text: "Sidona" -->
  <text x="90" y="35" font-family="serif" font-size="24" font-weight="bold" fill="#8B4513">Sidona</text>
  
  <!-- Text: "Green" -->
  <text x="170" y="35" font-family="serif" font-size="24" font-weight="bold" fill="#228B22">Green</text>
  
  <!-- Text: "CONSULTING" -->
  <text x="90" y="55" font-family="sans-serif" font-size="11" font-weight="normal" 
        fill="#666666" letter-spacing="2px">CONSULTING</text>
</svg> 